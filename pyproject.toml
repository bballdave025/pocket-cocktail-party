[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-cocktail-party"
version = "0.1.0"
description = "Blind source separation experiments through geometry, harmonics, and signal mixing."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "David Black", email = "22400988+bballdave025@users.noreply.github.com"}
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "ipykernel>=6",
  "jupyterlab>=4.6,<5",
  "nbformat>=5",
  "nbconvert[webpdf]>=7",
]

release = [
  "bump-my-version>=1,<2",
]

[tool.bumpversion]
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump version: {current_version} → {new_version}"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79
target-version = "py310"
